[package]
name = "pulpitry"
version = "0.2.1"
description = "Live speech transcription, Bible verse detection, and worship presentation."
authors = ["Ayorinde G. Smart"]
edition = "2021"
rust-version = "1.82"

[lib]
# The `_lib` suffix keeps the library name from colliding with the binary on
# Windows, where both would otherwise produce pulpitry.exe/pulpitry.lib.
name = "pulpitry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The parts the other product needs too, so there is one copy rather than two.
#
# A git dependency rather than a path: CI checks out this repository alone, and
# a path pointing outside it resolves only on a machine where both happen to sit
# side by side. Cargo.lock pins the exact commit, so builds stay reproducible
# even though the branch moves.
#
# For local work on both at once, override it per-machine rather than here:
#   cargo config: [patch."https://github.com/aysmart/castavox-core"]
#                 castavox-core = { path = "../castavox-core" }
castavox-core = { git = "https://github.com/aysmart/castavox-core", branch = "main" }

# protocol-asset lets the projector read a chosen background image or video
# through asset:, scoped at runtime to that one file.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
# `bundled` compiles SQLite in, so there is no dependency on whatever version
# the host happens to ship. FTS5 is enabled in that build.
rusqlite = { version = "0.40", features = ["bundled"] }
# Translation files are shipped gzipped: ~1.3 MB each instead of ~4.5 MB.
flate2 = "1"

# A .docx is a zip of XML, written by hand below: the format needed is four
# small files, and a document-model crate would be a large dependency to
# produce them.
zip = { version = "2", default-features = false, features = ["deflate"] }
# PDF has no such shortcut -- it is a binary format with an object graph and
# font metrics, and hand-rolling one is a week nobody should spend.
printpdf = { version = "0.7", default-features = false }
# Markdown, parsed by something that actually implements CommonMark.
#
# The summary is written by a model and read by a church: it will contain
# tables, nested lists, code fences and every other construct the spec allows,
# and hand-rolling that was producing a new edge case per test run. GFM
# extensions on, because that is the dialect people mean when they say
# Markdown. Pure Rust, no C, no build chain.
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd", "html"] }

# Pure-Rust inference: statically linked, so there is no ONNX Runtime dylib to
# bundle, sign and notarise separately on each platform.
# Named directly so the index build can be given its own, smaller pool. candle
# pulls it in regardless; without a pool of our own it takes every core, which
# on Windows means taking them from the interface.
rayon = "1"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
# fancy-regex rather than onig: pure Rust, no C library to build on Windows.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
# rustls rather than native-tls: no OpenSSL to find at build time on either
# platform, and the sidecar already proves we can ship without system deps.
# `rustls-no-provider` rather than `rustls`: the latter picks aws-lc-rs, whose
# C sources need CMake and NASM on the build machine. Ring builds everywhere
# with the toolchain we already have, which matters most for Windows.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "http2", "blocking"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
anyhow = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["time"] }

# Pinned to 3.x: it wraps the platform credential stores behind the stable
# Entry API. 4.x is a rewrite with a different store-registration model.
# Local transcription, for anyone who cannot run an Azure subscription. Wraps
# whisper.cpp, which builds with the toolchain already required here and uses
# Metal on macOS. Models are not vendored: they are fetched on request.
whisper-rs = { version = "0.16", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

# The Secret Service, reached over D-Bus, which is what GNOME Keyring and KWallet
# both speak. Needs libsecret at build time; without this target the crate is
# simply absent on Linux and every use of it fails to resolve.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native"] }

# Dependencies are optimised even in dev builds. Unoptimised candle makes
# embedding roughly an order of magnitude slower, which turns the one-off index
# build from two minutes into twenty during development. Our own crate stays
# unoptimised and debuggable.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
