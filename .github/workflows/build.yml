name: Build

# Every push builds installable packages for both platforms, because the whole
# point of the exercise is that Windows cannot be assumed to work from a Mac.
# Tagging v* additionally publishes them as a release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A second push should not race the first for the same artifacts.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the state of the other.
      fail-fast: false
      matrix:
        include:
          # Per architecture rather than a universal macOS binary: the speech
          # sidecar is a Node single-executable, and the SEA sentinel appears
          # once per slice, so a universal build has two and starts neither.
          - name: macOS (Apple silicon)
            os: macos-14
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-13
            target: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      # The sidecar is fused from whichever Node runs the build, so this
      # version is the one that ends up inside the shipped executable.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      # 45 MB of model weights, fetched once per run and worth caching: the
      # conversion is deterministic from the upstream files.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/embedder
          key: embedder-${{ hashFiles('scripts/build-embedder.mjs') }}

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npx tsc --noEmit

      - name: Test the core
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build the speech sidecar
        run: npm run sidecar:build

      - name: Prepare the embedding model
        run: npm run embedder:build

      - name: Package
        run: npx tauri build --target ${{ matrix.target }}

      # Unsigned. Signing needs certificates this repository does not carry;
      # see the release job below for what has to be added before these are
      # handed to anyone outside the team.
      - name: Collect installers
        uses: actions/upload-artifact@v4
        with:
          name: pulpitry-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

  release:
    name: Publish a release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Attach the installers to the tag
        uses: softprops/action-gh-release@v2
        with:
          files: installers/**/*
          fail_on_unmatched_files: true
          # Said plainly rather than left for someone to discover on first run.
          body: |
            Installers for macOS (Apple silicon and Intel) and Windows.

            These builds are **not code signed**. macOS will refuse to open the
            app until it is opened once from the right-click menu, and Windows
            SmartScreen will warn. Signing needs an Apple Developer ID and a
            Windows code signing certificate added as repository secrets.
