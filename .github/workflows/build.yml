name: Build

# Which platforms run, and why they differ:
#
#   Windows  every push. It cannot be built on the machine this is developed
#            on, so nothing else would ever catch a break.
#   Linux    every push. The cheapest runner GitHub bills -- 1x, against 2x for
#            Windows and 10x for macOS -- and where the platform-specific
#            breakage actually lives. Four Linux-only bugs turned up in one
#            afternoon of building it by hand.
#   macOS    tags and manual runs only. It is built natively on the development
#            machine several times a day, so a break is noticed in minutes for
#            free. Paying 10x per push to learn it later is the trade not worth
#            making.
#
# Tagging v* additionally publishes the result as a release.
on:
  push:
    branches: [main]
    # Every pattern the plan job understands has to be listed here too, or the
    # tag never reaches it.
    tags: ["v*", "win-*", "windows-*", "linux-*", "mac-*", "macos-*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        default: desktop
        options: [desktop, windows, linux, macos, all, none]

# A second push should not race the first for the same artifacts.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which platforms this run should build. A matrix cannot be filtered by event
  # once it exists, so it is decided here and read back with fromJSON.
  plan:
    name: Decide the platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - id: pick
        shell: bash
        # Runner minutes are finite and macOS bills at ten times Linux, so what
        # builds is chosen deliberately rather than by default. A tag says which
        # platform it is for; a manual run picks from a list; an ordinary push
        # builds nothing, because most pushes are a comment or a README and
        # paying for four runners to prove that is how a month's allowance
        # disappears.
        run: |
          set -euo pipefail
          windows='{"name":"Windows","os":"windows-latest","target":"x86_64-pc-windows-msvc"}'
          linux='{"name":"Linux (x86_64)","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"}'
          # macos-26, which is what Castavox builds on and what apple-metal
          # actually needs. That crate comes in with the NDI screen capture and
          # its Swift bridge uses MTLLogState, MTLResidencySet and
          # MTLSamplerReductionMode. macos-14 failed on the first of those and
          # macos-15 on the third, each time inside a build script and each time
          # reading like a broken crate rather than an SDK a version behind.
          arm='{"name":"macOS (Apple silicon)","os":"macos-26","target":"aarch64-apple-darwin"}'

          # Intel is not built. It was, and it was never published: the download
          # page offers Apple silicon only, and the publish step deleted the
          # Intel disk image again on the way past.
          #
          # It was not merely wasteful. macos-13 runners are scarce, so the job
          # sat queued long after the others had finished -- and the release job
          # needs every one of them, so a queue nobody was watching held the
          # whole publish. We paid for a build in order to throw it away and
          # waited on it to ship.
          #
          # If Intel is ever wanted, it comes back here and in the publish step
          # together, or this happens again.

          choose() {
            case "$1" in
              windows) echo "$windows" ;;
              linux)   echo "$linux" ;;
              macos)   echo "$arm" ;;
              desktop) echo "$windows,$linux" ;;
              all)     echo "$windows,$linux,$arm" ;;
              none|*)  echo "" ;;
            esac
          }

          ref='${{ github.ref }}'
          want=none

          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            want='${{ inputs.platforms }}'
            reason="manual run"
          else
            case "${ref#refs/tags/}" in
              win-*|windows-*) want=windows; reason="a Windows tag" ;;
              linux-*)         want=linux;   reason="a Linux tag" ;;
              mac-*|macos-*)   want=macos;   reason="a macOS tag" ;;
              v*)              want=all;     reason="a release tag" ;;
              *)               want=none;    reason="an ordinary push -- tag it or dispatch it to build" ;;
            esac
          fi

          entries=$(choose "$want")
          if [ -z "$entries" ]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "Building nothing: $reason."
          else
            echo "matrix={\"include\":[$entries]}" >> "$GITHUB_OUTPUT"
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "Building $want: $reason."
          fi

  package:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the others' results.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      # The sidecar is fused from whichever Node runs the build, so this
      # version is the one that ends up inside the shipped executable.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      # 45 MB of model weights, fetched once per run and worth caching: the
      # conversion is deterministic from the upstream files.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/embedder
          key: embedder-${{ hashFiles('scripts/build-embedder.mjs') }}

      # Tauri renders through the system webview, which on Linux is WebKitGTK
      # and is not on the runner. Held at 22.04 because that is the oldest glibc
      # worth requiring. xdg-utils is for linuxdeploy, which shells out to
      # xdg-open while assembling the AppImage.
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf \
            rpm \
            file \
            xdg-utils

      - name: Install dependencies
        run: npm ci

      # Before anything compiles the crate. Tauri's build script checks the
      # resource globs in tauri.conf.json, and resources/embedder/* not existing
      # is a hard build failure rather than a missing file at runtime -- so with
      # these below the tests, a cold cache broke the build on every platform at
      # once and looked like a test failure.
      - name: Build the speech sidecar
        run: npm run sidecar:build

      - name: Prepare the embedding model
        run: npm run embedder:build

      - name: Check types
        run: npx tsc --noEmit

      # Windows has a 260-character path limit, and the Vulkan backend builds a
      # shader generator four sub-projects deep inside target/. The result is
      # `FTK1011: could not create the new file tracking log file`, which names
      # a tracking log rather than the length and sends you looking for a
      # permissions problem that is not there.
      #
      # A short target directory is the whole fix: the paths underneath it are
      # what they are, and this is the only part we control.
      # Everything downstream reads TARGET_ROOT rather than assuming
      # src-tauri/target, because on Windows it is neither.
      # Ninja, not MSBuild, for the CMake sub-builds.
      #
      # FTK1011 is a *FileTracker* error, and FileTracker is MSBuild's. The
      # path it cannot create is whisper.cpp's Vulkan shader generator, four
      # sub-projects deep, and shortening our end of it was not enough: from
      # C:\ct the remainder is still around 200 characters of whisper-rs-sys's
      # own nesting, which we do not control.
      #
      # Ninja does not use FileTracker, so the error cannot occur rather than
      # occurring less often. It needs the MSVC environment, which is what the
      # dev-cmd step is for -- without it cmake finds no compiler at all.
      - name: MSVC environment for Ninja
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ninja
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Build CMake sub-projects with Ninja
        if: runner.os == 'Windows'
        run: echo "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Keep Windows build paths short
        if: runner.os == 'Windows'
        run: |
          echo "CARGO_TARGET_DIR=C:\ct" >> $env:GITHUB_ENV
          echo "TARGET_ROOT=C:\ct" >> $env:GITHUB_ENV
          git config --system core.longpaths true
        shell: pwsh

      - name: Where the build output lands
        if: runner.os != 'Windows'
        run: echo "TARGET_ROOT=src-tauri/target" >> $GITHUB_ENV

      - name: Test the core
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # The Mac build is signed with a certificate of our own, so that macOS
      # recognises each release as the same application as the last.
      #
      # Unsigned -- ad-hoc, which is what the linker does on its own -- every
      # build was a stranger. Screen Recording and the microphone are granted
      # to an application's signature, so each update asked for both again,
      # and Settings went on showing the old grant switched on while refusing
      # the new build. A church that updated on Saturday found its NDI feed
      # blank on Sunday, and the permission it had given still ticked.
      #
      # Self-signed, not Apple's: Gatekeeper still warns about an unfamiliar
      # developer exactly as before. What changes is only that the signature
      # is the same one every time. Tauri signs with the identity named in
      # APPLE_SIGNING_IDENTITY and the keychain search list; the certificate
      # itself is never passed to Tauri, whose own import looks for an
      # Apple-issued identity and would not find this one.
      - name: Signing identity
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CERTIFICATE" ]; then
            # A release must never go out unsigned: it would cost every church
            # on a Mac its permissions, once more, for nothing.
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::MACOS_SIGNING_CERTIFICATE is not set; a release cannot be built unsigned."
              exit 1
            fi
            echo "::warning::No signing certificate; this Mac build is unsigned."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -P "$CERTIFICATE_PASSWORD" -A \
            -t cert -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/signing.p12"
          echo "APPLE_SIGNING_IDENTITY=Castavox Code Signing" >> "$GITHUB_ENV"

      - name: Package
        env:
          # Signs the update artifacts. Without it `createUpdaterArtifacts`
          # fails the build rather than shipping unsigned ones, which is the
          # right way round: an updater that installs whatever a manifest points
          # at is a way onto every machine in every church running this.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # `createUpdaterArtifacts` is passed here rather than kept in
        # tauri.conf.json, because with it set every build demands the signing
        # key -- including a developer's local one, which then fails with a
        # message about a private key nobody expected to need. CI has the key;
        # a laptop does not and should not.
        # No resource override: `resources/*` in tauri.conf.json already globs
        # the directory the loader is copied into, and passing a resources array
        # here would *replace* that list rather than add to it -- taking the
        # speech sidecar and the embedder out of the bundle with it.
        run: >
          npx tauri build --target ${{ matrix.target }}
          --config '{"bundle":{"createUpdaterArtifacts":true}}'

      # Proof, rather than trust, that the step above signed what it built.
      #
      # The requirement is what macOS stores a permission against: this
      # identifier, from this certificate. If it ever reads otherwise -- a
      # Tauri change that quietly skips signing, a replaced certificate --
      # every church on a Mac would be asked for Screen Recording and the
      # microphone again, and this is the last place anyone could notice
      # before they are. The hash is the certificate's, and changes only if
      # the certificate does; if it is ever replaced, change it here too.
      - name: Signed as Pulpitry
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        shell: bash
        run: |
          set -euo pipefail
          app=$(ls -d "$TARGET_ROOT/${{ matrix.target }}/release/bundle/macos/"*.app | head -1)
          codesign --verify --deep --strict "$app"
          requirement=$(codesign -d -r- "$app" 2>&1)
          echo "$requirement"
          expected='identifier "com.pulpitry.desktop" and certificate root = H"73af553e776da311688d97b1778d68940ec2c693"'
          if ! grep -qF "$expected" <<< "$requirement"; then
            echo "::error::Pulpitry.app is not signed as expected; every Mac would ask for its permissions again."
            exit 1
          fi

      # Windows and Linux are unsigned; the Mac build is signed, above, with a
      # certificate of our own rather than Apple's, so Gatekeeper and
      # SmartScreen still warn. See the release job below for what that means
      # for the people downloading these.
      - name: Collect installers
        uses: actions/upload-artifact@v4
        with:
          name: pulpitry-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ${{ env.TARGET_ROOT }}/${{ matrix.target }}/release/bundle/dmg/*.dmg
            ${{ env.TARGET_ROOT }}/${{ matrix.target }}/release/bundle/msi/*.msi
            ${{ env.TARGET_ROOT }}/${{ matrix.target }}/release/bundle/nsis/*.exe
            ${{ env.TARGET_ROOT }}/${{ matrix.target }}/release/bundle/deb/*.deb
            ${{ env.TARGET_ROOT }}/${{ matrix.target }}/release/bundle/rpm/*.rpm
            ${{ env.TARGET_ROOT }}/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            # The updater's own artifacts, which are not the installers.
            #
            # Listing the installers explicitly is deliberate -- it is what
            # keeps a stray file out of a release -- but it means anything new
            # has to be added here or it never leaves this job. The first run
            # with signing enabled produced every signature and uploaded none
            # of them, so the manifest step found nothing and published
            # nothing. The build was green throughout.
            #
            # macOS updates from a tarball rather than the disk image; the
            # other platforms update from the installer they already ship.
            ${{ env.TARGET_ROOT }}/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            ${{ env.TARGET_ROOT }}/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            ${{ env.TARGET_ROOT }}/${{ matrix.target }}/release/bundle/msi/*.msi.sig
            ${{ env.TARGET_ROOT }}/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            ${{ env.TARGET_ROOT }}/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig

  # Publishing, which happens somewhere else on purpose.
  #
  # This repository is private between releases: it is made public for the few
  # minutes a build needs and put back afterwards. A release attached *here*
  # would go private with it — which is what this job used to do, and why every
  # release so far has been assembled by hand instead: download a gigabyte of
  # artifacts, rename them, upload them to castavox-downloads. That hour was an
  # hour this repository spent public.
  #
  # So it publishes to castavox-downloads, which is public and stays public, and
  # which the website links straight at.
  #
  # Needs DOWNLOADS_TOKEN: a token with contents:write on castavox-downloads.
  # The built-in GITHUB_TOKEN cannot reach another repository, by design.
  release:
    name: Publish to castavox-downloads
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # For docs/release-notes only; the installers come from the artifacts.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: installers

      # Tauri's own names are kept, with one exception.
      #
      # The disk image is `Pulpitry_0.3.0_aarch64.dmg` out of the build, and
      # every published release has carried it as `Pulpitry-0.3.0-macos-arm64.dmg`
      # — which says the thing somebody choosing a download needs to know. The
      # rest are already clear enough, and renaming them would break links that
      # already work.
      - name: Name the disk image the way the site expects 🏷️
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          find installers -type f -exec cp {} out/ \;

          dmg=$(find out -name "*aarch64.dmg" | head -1)
          if [ -n "$dmg" ]; then
            mv "$dmg" "out/Pulpitry-${version}-macos-arm64.dmg"
          fi

          ls -1 out

      # Notes are written where the change was made, not in this file.
      #
      # A workflow cannot know what a release means to somebody installing it,
      # and boilerplate about code signing is not release notes. So each version
      # gets docs/release-notes/<version>.md, and this uses it when it exists --
      # falling back to the installation notes alone rather than publishing
      # nothing, because a release with thin notes is better than none.
      - name: Gather the release notes 📝
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # The title says 0.3.1, not v0.3.1: the tag is how we refer to it,
          # not how somebody choosing a download does.
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          written="docs/release-notes/${version}.md"

          if [ -f "$written" ]; then
            cp "$written" notes.md
            echo "Using $written"
          else
            echo "No $written; publishing the installation notes alone." >&2
            cat > notes.md <<'FALLBACK'
          Installers for macOS (Apple silicon), Windows, and Linux
          (.deb, .rpm and .AppImage, x86_64).

          These builds are **not notarised by Apple or signed for Windows**.
          macOS will refuse to open the app until it is opened once from the
          right-click menu, and Windows SmartScreen will warn.
          FALLBACK
          fi

      # The manifest the installed applications read.
      #
      # Built from the signatures the bundler just produced, and published to a
      # tag that never moves -- `pulpitry-latest` -- so the URL compiled into
      # every copy of the application stays valid for ever. Versioned tags carry
      # the installers; this one carries only the answer to "is there a newer
      # one".
      #
      # It is published to the downloads repository rather than to a service of
      # ours, which is two promises at once: the check reaches GitHub rather
      # than us, as the privacy policy says, and there is nothing of ours to be
      # down at the moment a church tries to update.
      - name: Assemble the update manifest 📜
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes=$(head -c 400 notes.md | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')

          platforms=""
          add() {
            local key="$1" file="$2"
            [ -f "$file.sig" ] || return 0
            local sig
            sig=$(cat "$file.sig")
            local name
            name=$(basename "$file")
            platforms="${platforms}    \"${key}\": { \"signature\": \"${sig}\", \"url\": \"https://github.com/aysmart/castavox-downloads/releases/download/pulpitry-${GITHUB_REF_NAME}/${name}\" },\n"
          }

          # Tauri names these per platform; only the ones this run produced are
          # listed, so a partial matrix cannot advertise a download that is not
          # there.
          for f in out/*.tar.gz out/*.zip out/*.AppImage out/*-setup.exe out/*.msi; do
            [ -e "$f" ] || continue
            case "$f" in
              *.app.tar.gz|*macos*.tar.gz) add "darwin-aarch64" "$f" ;;
              *.AppImage)                  add "linux-x86_64" "$f" ;;
              *-setup.exe|*.msi|*.zip)     add "windows-x86_64" "$f" ;;
            esac
          done

          if [ -z "$platforms" ]; then
            # Loud, because silence is what let the first attempt look green
            # while shipping an updater that could never find anything.
            echo "::warning::No signed artifacts found in out/ — no update manifest published. Installed copies will not see this release."
            exit 0
          fi

          printf '{\n  "version": "%s",\n  "notes": %s,\n  "pub_date": "%s",\n  "platforms": {\n%s  }\n}\n' \
            "$version" "$notes" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$(printf "$platforms" | sed '$ s/,$//')" \
            > latest.json
          cat latest.json

      - name: Publish the manifest 📜
        if: hashFiles('latest.json') != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: aysmart/castavox-downloads
          token: ${{ secrets.DOWNLOADS_TOKEN }}
          # A tag that never moves, so the URL inside every installed copy stays
          # valid. The asset is replaced on each release.
          tag_name: pulpitry-latest
          name: Pulpitry — latest
          files: latest.json
          prerelease: true
          body: |
            The manifest installed copies of Pulpitry read to find out whether a
            newer version exists. Not a download: the installers are on the
            versioned releases.

      - name: Publish 🚀
        uses: softprops/action-gh-release@v2
        with:
          repository: aysmart/castavox-downloads
          token: ${{ secrets.DOWNLOADS_TOKEN }}
          # pulpitry-v0.3.0 there, from v0.3.0 here: one downloads repository
          # holds both products' releases, so the tags have to say which.
          tag_name: pulpitry-${{ github.ref_name }}
          name: Pulpitry ${{ steps.notes.outputs.version }}
          files: out/*
          fail_on_unmatched_files: true
          prerelease: true
          body_path: notes.md
