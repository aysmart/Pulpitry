name: Build for Windows

# Windows only. macOS and Linux are built locally -- macOS natively, Linux in a
# container -- and repeating them on a hosted runner buys nothing. Windows is the
# one platform that cannot be built from the machine this is developed on, which
# is exactly why it is the one kept here.
# Tagging v* additionally publishes the result as a release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A second push should not race the first for the same artifacts.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # A matrix of one, kept as a matrix so a second target -- arm64 Windows,
      # most likely -- is an added line rather than a rewrite.
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      # The sidecar is fused from whichever Node runs the build, so this
      # version is the one that ends up inside the shipped executable.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      # 45 MB of model weights, fetched once per run and worth caching: the
      # conversion is deterministic from the upstream files.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/embedder
          key: embedder-${{ hashFiles('scripts/build-embedder.mjs') }}

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npx tsc --noEmit

      - name: Test the core
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build the speech sidecar
        run: npm run sidecar:build

      - name: Prepare the embedding model
        run: npm run embedder:build

      - name: Package
        run: npx tauri build --target ${{ matrix.target }}

      # Unsigned. Signing needs certificates this repository does not carry;
      # see the release job below for what has to be added before these are
      # handed to anyone outside the team.
      - name: Collect installers
        uses: actions/upload-artifact@v4
        with:
          name: pulpitry-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

  release:
    name: Publish a release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Attach the installers to the tag
        uses: softprops/action-gh-release@v2
        with:
          files: installers/**/*
          fail_on_unmatched_files: true
          # Said plainly rather than left for someone to discover on first run.
          body: |
            Windows installers (.msi and .exe, x64).

            macOS and Linux packages are built locally and published to
            https://github.com/aysmart/castavox-downloads rather than here.

            These builds are **not code signed**, so Windows SmartScreen will
            warn. Signing needs a Windows code signing certificate added as a
            repository secret.
